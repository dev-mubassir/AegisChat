workflows:
  ios-release:
    name: iOS Unsigned IPA Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          cd app
          flutter packages pub get
      - name: Build unsigned iOS IPA
        script: |
          cd app
          flutter build ipa --no-codesign
    artifacts:
      - app/build/ios/archive/**/*.xcarchive
      - app/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - dev@example.com
        notify:
          on_success: false
          on_failure: false
